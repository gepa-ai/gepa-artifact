[tool.uv.sources]
arbor-ai = { path = "gepa_artifact/utils/arbor", editable = true }
dspy = { path = "gepa_artifact/utils/dspy", editable = true }

[tool.uv]
no-build-isolation-package = ["flash-attn"]
exclude-newer = "2025-08-04T00:00:00Z"
# Lock only for Python 3.12, the version of every original run (.python-version is 3.12.9).
environments = ["python_version == '3.12'"]
